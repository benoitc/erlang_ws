name: CI

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['28', '29']
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.24'

      - name: Cache rebar3 deps
        uses: actions/cache@v4
        with:
          path: |
            _build/default/lib
            _build/default/plugins
            _build/test/lib
            ~/.cache/rebar3
          key: rebar3-${{ runner.os }}-otp${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
          restore-keys: rebar3-${{ runner.os }}-otp${{ matrix.otp }}-

      - name: Compile
        run: rebar3 compile

      - name: EUnit
        run: rebar3 eunit

      - name: PropEr
        run: rebar3 proper -m ws_prop_tests

      - name: Common Test
        run: rebar3 ct

      - name: Upload CT logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ct-logs-otp${{ matrix.otp }}
          path: _build/test/logs
          retention-days: 7

  xref:
    name: Xref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.24'

      - name: Cache rebar3 deps
        uses: actions/cache@v4
        with:
          path: |
            _build/default/lib
            _build/default/plugins
            ~/.cache/rebar3
          key: rebar3-xref-${{ runner.os }}-otp29-${{ hashFiles('rebar.config', 'rebar.lock') }}
          restore-keys: rebar3-xref-${{ runner.os }}-otp29-

      - name: Xref
        run: rebar3 xref

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.24'

      - name: Cache rebar3 deps
        uses: actions/cache@v4
        with:
          path: |
            _build/default/lib
            _build/default/plugins
            ~/.cache/rebar3
          key: rebar3-dialyzer-${{ runner.os }}-otp29-${{ hashFiles('rebar.config', 'rebar.lock') }}
          restore-keys: rebar3-dialyzer-${{ runner.os }}-otp29-

      - name: Cache PLT
        uses: actions/cache@v4
        with:
          path: _build/default/*_plt
          key: plt-${{ runner.os }}-otp29-${{ hashFiles('rebar.config') }}
          restore-keys: plt-${{ runner.os }}-otp29-

      - name: Dialyzer
        run: rebar3 dialyzer

  docs:
    name: Docs + hex build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24'

      - name: Generate ex_doc HTML
        run: rebar3 ex_doc

      - name: Build hex tarball
        run: rebar3 hex build

      - name: Upload release tarballs
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: hex-tarballs
          path: _build/default/lib/ws/hex/*.tar
          retention-days: 30

  autobahn:
    name: Autobahn compliance
    runs-on: ubuntu-latest
    # Run on main + tags + PRs. The job pulls a ~150 MB image and runs
    # ~300 test cases, so it is kept out of the per-OTP matrix.
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24'

      - name: Compile
        run: rebar3 compile

      - name: Run Autobahn fuzzingclient
        env:
          WS_RUN_AUTOBAHN: '1'
        run: rebar3 ct --suite=test/ws_compliance_SUITE

      - name: Upload Autobahn report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-report
          path: _build/test/logs
          retention-days: 30
